<!DOCTYPE html>
<html lang="en">
<head>
  <title>EMI Calculator</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.anychart.com/releases/8.10.0/js/anychart-bundle.min.js"></script>
  <script src="https://cdn.anychart.com/releases/v8/js/anychart-ui.min.js"></script>
  <script src="https://cdn.anychart.com/releases/v8/js/anychart-exports.min.js"></script>
  <link href="https://cdn.anychart.com/releases/v8/css/anychart-ui.min.css" type="text/css" rel="stylesheet">
</head>
<body>
  <div id="chart-container" style="width: 100%; height: 300px;"></div>
  <h1 class="card-title text-center" data-tamil="சமமான மாதாந்திர தவணை கணக்கீடு" data-english="Equal Monthly Installment Calculator">
    சமமான மாதாந்திர தவணை கணக்கீடு
  </h1>

  <div class="fields-container row container-sm">
    <div class="col-lg-6 col-md-5 col-sm-2 mx-auto">
      <div class="header text-end mt-1">
        <div class="dropdown">
          <button class="btn btn-primary dropdown-toggle" type="button" id="languageDropdown" data-bs-toggle="dropdown">
            Language
          </button>
          <ul class="dropdown-menu" aria-labelledby="languageDropdown">
            <li><a class="dropdown-item" href="#" id="english-option">English</a></li>
            <li><a class="dropdown-item" href="#" id="tamil-option">தமிழ்</a></li>
          </ul>
        </div>
      </div>
      <h2 data-tamil="உங்கள் தரவை உள்ளிடவும்" data-english="Enter Your Data!!!">உங்கள் தரவை உள்ளிடவும்</h2>
      <div class="form-group">
        <label for="Principal" class="form-label" data-tamil="அசல் (ரூ):" data-english="Principal:">அசல் (ரூ):</label>
        <input type="number" id="Principal" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="paymentInAdvance" class="form-label" data-tamil="முன் பணம் (ரூ):" data-english="Advance Payment (₹):">
          முன் பணம் (ரூ):
        </label>
        <input type="number" id="paymentInAdvance" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="InterestRate" class="form-label" data-tamil="வட்டி விகிதம் (%):" data-english="Interest Rate (%):">
          வட்டி விகிதம் (%):
        </label>
        <input type="number" id="InterestRate" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="month" class="form-label" data-tamil="மாதங்கள் :" data-english="Months:">மாதங்கள் :</label>
        <input type="number" id="month" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="tax" class="form-label" data-tamil="வரி (ஆண்டு):" data-english="Tax (Annual):">வரி (ஆண்டு):</label>
        <input type="number" id="tax" class="form-control" required>
      </div>
      <button type="button" id="calBtn" class="btn btn-danger" data-tamil="கணக்கீடு" data-english="Calculate">கணக்கீடு</button>
    </div>
    <div class="col-lg-6 col-md-5 col-sm-3 mx-auto">
      <h2 data-tamil="உங்கள் தரவை இங்கே காணவும்" data-english="Your Data Here!!!">உங்கள் தரவை இங்கே காணவும்</h2>
      <div class="form-group">
        <label class="form-label" data-tamil="கடன் தொகை (ரூ):" data-english="Loan Amount (₹):">கடன் தொகை (ரூ):</label>
        <div id="loanAmount" class="p-3 form-control"></div>
      </div>
      <div class="form-group">
        <label class="form-label" data-tamil="மாத தவணை தொகை :" data-english="Monthly EMI Amount:">மாத தவணை தொகை :</label>
        <div id="monthlyEmi" class="p-3 form-control"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
